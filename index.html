		<style>
			:root {
				--bg-color: #f4f5f7;
				--card-bg: #ffffff;
				--header-bg: rgba(255, 255, 255, 0.85);
				--line-color: #e2e8f0;
				--text-main: #0f172a;
				--text-muted: #64748b;
				--text-hover: #25b786;
				--icon-color: #64748b;
				--icon-hover: #0f172a;
				--card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
			}
			
			[data-theme="dark"] {
				--bg-color: #0b0e11;
				--card-bg: #1c1c1c;
				--header-bg: rgba(11, 14, 17, 0.85);
				--line-color: #262626;
				--text-main: #f8fafc;
				--text-muted: #94a3b8;
				--text-hover: #25b786;
				--icon-color: #94a3b8;
				--icon-hover: #ffffff;
				--card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
			}

			html, body {
				margin: 0;
				padding: 0;
				width: 100vw;
				height: 100dvh;
				overflow: hidden !important;
				background-color: var(--bg-color);
				color: var(--text-main);
				font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif !important;
				font-feature-settings: "cv02", "cv05", "tnum";
				-webkit-font-smoothing: antialiased;
			}

			body {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				user-select: none;
			}

			.body-content {
				width: 100%;
				max-width: 1080px;
				margin: 0 auto;
				padding: 0 16px;
				box-sizing: border-box;
			}

			.header {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				height: 64px;
				z-index: 99;
				background-color: var(--header-bg);
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px);
				border-bottom: 1px solid var(--line-color);
				transition: border-color 0.3s ease, background-color 0.3s ease;
			}

			.header-content {
				height: 100%;
				display: flex;
				flex-direction: row;
				align-items: center;
				justify-content: space-between;
			}

			.header-actions {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.main-wrapper {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				padding-top: 64px;
				padding-bottom: 60px;
				padding-left: 15px;
				padding-right: 15px;
				box-sizing: border-box;
				position: relative;
				z-index: 1;
			}

			.swap-container {
				width: 420px;
				max-width: 100%;
				background-color: var(--card-bg);
				border-radius: 18px;
				box-shadow: var(--card-shadow);
				overflow: hidden;
				transition: background-color 0.3s ease, box-shadow 0.3s ease;
			}

			.footer {
				position: fixed;
				bottom: 0;
				left: 0;
				right: 0;
				height: 60px;
				z-index: 90;
				background-color: var(--header-bg);
				backdrop-filter: blur(12px);
				-webkit-backdrop-filter: blur(12px);
				border-top: 1px solid var(--line-color);
				transition: border-color 0.3s ease, background-color 0.3s ease;
			}

			.footer-content {
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}

			.footer-links {
				display: flex;
				align-items: center;
				gap: 20px;
			}

			.footer-link {
				color: var(--text-muted);
				font-size: 15px;
				font-weight: 500;
				text-decoration: none;
				transition: color 0.2s ease;
				-webkit-tap-highlight-color: transparent;
			}

			.footer-link:hover {
				color: var(--text-hover);
			}

			.footer-socials {
				display: flex;
				align-items: center;
				gap: 16px;
			}

			.social-icon-btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 34px;
				height: 34px;
				border-radius: 8px;
				color: var(--icon-color);
				transition: all 0.2s ease;
				-webkit-tap-highlight-color: transparent;
			}

			.social-icon-btn svg {
				width: 18px;
				height: 18px;
				fill: currentColor;
			}

			.social-icon-btn:hover {
				color: var(--icon-hover);
				background-color: rgba(150, 150, 150, 0.1);
				transform: translateY(-1px);
			}
			
			@media (max-height: 700px) {
				.footer {
					display: none;
				}
			}
			

			@media (max-width: 480px) {
				.footer-links {
					gap: 14px;
				}
				.footer-link {
					font-size: 14px;
				}
				.footer-socials {
					gap: 10px;
				}
			}
		</style>
	</head>

		<script type="module">
			// theme
			function initTheme() {
				const savedTheme = localStorage.getItem('theme') || 'light';
				setTheme(savedTheme);
				return savedTheme;
			}
			function setTheme(theme) {
				document.documentElement.setAttribute('data-theme', theme);
				localStorage.setItem('theme', theme);
				const tokensBg = document.querySelector('#tokens-bg');
				tokensBg?.setAttribute('theme', theme);
			}
			const themeContainer = document.querySelector('#theme-choose');
			themeContainer.addEventListener('choose-theme', function(e){
				const theme = e.detail === 'dark' ? 'dark' : 'light';
				setTheme(theme);
			});
			
			// chain
			function initChain() {
				const savedChain = localStorage.getItem('chain') || 'rootstock';
				return savedChain;
			}
			function setChain(chain) {
				localStorage.setItem('chain', chain);
			}
			const chainContainer = document.querySelector('#chain-choose');
			chainContainer.addEventListener('choose-chain', function(e){
				setChain(e.detail);
			});
			
			// lang
			const defaultLang = 'en';
			const supported = ['en', 'zh-Hans', 'ja', 'ko'];
			function detectLang() {
				const nav = window.navigator;
				let lang = (nav.languages && nav.languages[0]) || nav.language || nav.userLanguage || defaultLang;
				const _supported = supported.map(item => item.toLowerCase());
				lang = lang.toLowerCase();
				if (_supported.includes(lang)) return lang;
				
				lang = lang.split('-')[0];
				if (_supported.includes(lang)) return lang;
				
				for(let i = 0; i < supported.length; i++){
					const itemLang = supported[i];
					if(itemLang.indexOf('-') !== -1){
						const newId = itemLang.split('-')[0];
						if(newId.toLowerCase() === lang){
							return itemLang;
						}
					}
				}
				return defaultLang;
			}
			function initLang() {
				const savedLang = localStorage.getItem('lang') || detectLang();
				return savedLang;
			}
			function setLang(lang) {
				localStorage.setItem('lang', lang);
			}
			const langContainer = document.querySelector('#lang-choose');
			langContainer.addEventListener('choose-lang', function(e){
				setLang(e.detail);
			});
			
			const currentChain = initChain();
			const currentLang = initLang();
			const currentTheme = initTheme();

			// SDK
			import { createConnect } from 'https://esm.sh/@swaptox/connect-ui';
			import { createWidget } from 'https://esm.sh/@swaptox/widget';
			//import { createWidget } from './src/index.js';

			const connectConfig = {
				projectId: '19c224694c2b8c5e44f39cd795aa0837',
				chains: ['base', 'rootstock'],
				currentChain: currentChain,
				metadata: {
					name: 'SwaptoX',
					description: 'Swap Aggregator & DEX',
					logo: 'https://cdn.swaptox.com/logo.png',
					url: location.origin,
				},
				rpcMap: {},
			};
			
			const $swaptoxConnect = createConnect(connectConfig, {
				theme: currentTheme,
				lang: currentLang,
			});
			
			const $swaptoxWidget = createWidget({
				container: '.swap-container',
				chain: currentChain,
				lang: currentLang,
				isUpdateHtmlLang: true,
				theme: currentTheme,
				userAddress: '',
				themePack: {
					'light': {
						'fallback': 'light',
						'data': {
							'--stxui-card-border-color': '#e2e8f0',
						}
					},
					'dark': {
						'fallback': 'dark',
						'data': {
							'--stxui-card-border-color': '#262626',
						}
					},
				},
			});

			// Hide Loading
			const loadingEl = document.querySelector('#sdk-loading');
			if (loadingEl) {
				loadingEl.style.display = 'none';
			}
		</script>
